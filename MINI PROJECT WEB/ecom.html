
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy | Online Shopping</title>

    <link rel="stylesheet" href="ecom.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>grabON</h1>
        <p>grabbb it !!!</p>
        <img src="https://play-lh.googleusercontent.com/RMYloWXbmSQEnkWzpc1Ya4RX5jp9gLse7MJRWiHRDGgv3VwuV2DvvfbBvtlfJXV-4nlYRFK569rUVnt5tmUpgOg" alt="">

        <div class="cart-info">
            🛒 Cart: <span id="cartCount">0</span> items

            <span class="separator">|</span>

            Total: <span id="cartTotal">₹0.00</span>

            <button id="viewCartBtn">View Cart</button>
        </div>
    </header>

    <main>

        <!-- Search, Filter and Sort -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>

            <select id="sortOption">
                <option value="">Sort Products</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>

        </section>

        <!-- Loading and Error Messages -->
        <p id="loading">Loading products...</p>

        <p id="error"></p>

        <!-- Products -->
        <section id="productContainer" class="product-container">
        </section>

        <!-- Load More -->
        <button id="loadMoreBtn">Load More</button>

        <!-- Shopping Cart -->
        <section id="cartSection" hidden>

            <h2>Your Shopping Cart</h2>

            <div id="cartItems"></div>

            <h3>
                Cart Total:
                <span id="cartPageTotal">₹0.00</span>
            </h3>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 grabON. All Rights Reserved.</p>
    </footer>

    <script src="ecom.js"></script>

</body>
</html>

<script>

    let students = [
    { name: "Rahul", marks: 80 },
    { name: "Amit", marks: 35 },
    { name: "Priya", marks: 90 },
    { name: "Neha", marks: 60 }
];

let selectedStudents = students.filter(student => student.marks >= 60);

let names = selectedStudents.map(student => student.name);

let totalMarks = selectedStudents.reduce((total, student) => total + student.marks, 0);

console.log(names);
console.log(totalMarks);
</script>

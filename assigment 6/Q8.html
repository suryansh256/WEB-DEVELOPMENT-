<script>
    function checkResult(marks) {
    return new Promise((resolve, reject) => {
        if (marks >= 40) {
            resolve("Pass");
        } else {
            reject("Fail");
        }
    });
}

async function displayResult() {
    try {
        let result = await checkResult(65);
        console.log(result);
    } catch (error) {
        console.log(error);
    }
}

displayResult();
</script>
</html>

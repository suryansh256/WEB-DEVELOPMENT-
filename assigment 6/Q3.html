<script>
function checkAge(age) {
    return new Promise((resolve, reject) => {
        if (age >= 18) {
            resolve("You can vote");
        } else {
            reject("You cannot vote");
        }
    });
}

checkAge(20)
    .then((message) => {
        console.log(message);
    })
    .catch((error) => {
        console.log(error);
    });</script>

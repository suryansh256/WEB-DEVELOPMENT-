<script> let x = 10;

let myPromise = new Promise((resolve, reject) => {
    if (x === 10) {
        resolve("Success");
    } else {
        reject("Something went wrong");
    }
});

myPromise
    .then((message) => {
        console.log(message);
    })
    .catch((error) => {
        console.log(error);
    });</script>


<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage Assignment</title>
    <link rel="stylesheet" href="ps2.css">
</head>
<body>

    <h1>JavaScript LocalStorage Assignment</h1>


    <h2>Q1. Save Student Name</h2>

    <input type="text" id="studentName" placeholder="Enter student name">
    <button id="saveName">Save</button>
    <p id="message1"></p>



    <h2>Q2. Retrieve Student Name</h2>

    <button id="displayName">Display Name</button>
    <h3 id="result1"></h3>



    <h2>Q3. Save and Display Email</h2>

    <input type="email" id="email" placeholder="Enter email">
    <button id="saveEmail">Save Email</button>
    <p id="result2"></p>



    <h2>Q4. Remove Stored Data</h2>

    <input type="text" id="username" placeholder="Enter username">
    <button id="saveUsername">Save Username</button>
    <button id="removeUsername">Remove</button>
    <p id="result3"></p>



    <h2>Q5. Save and Retrieve City Name</h2>

    <input type="text" id="city" placeholder="Enter city name">
    <button id="saveCity">Save City</button>
    <button id="displayCity">Display City</button>
    <p id="result4"></p>


    <script src="ps2.js"></script>

</body>
</html>
